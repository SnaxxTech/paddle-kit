version: 2
updates:
  # @paddle/paddle-js (the client peer) and @paddle/paddle-node-sdk (the signature test's oracle) are the Paddle packages.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      paddle: { patterns: ['@paddle/*'] }
    ignore:
      # TypeScript 7 has no compiler API, so tsup's d.ts build fails (tsup 8 and 9). Drop this when tsup supports it.
      - dependency-name: typescript
        versions: ['>=7']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
